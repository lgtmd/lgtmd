[package]
name = "lgtmd-node"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Coarse Node host bridge for the lgtmd compiler and artifact store"

[[bin]]
name = "lgtmd-node"
path = "src/main.rs"

[dependencies]
lgtmd = { path = "../lgtmd", version = "0.0.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
