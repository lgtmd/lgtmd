[package]
name = "lgtmd"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "Rust-authored executable documents with checked observations and owned artifacts"
readme = "README.md"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
same-file = "=1.0.6"
pulldown-cmark = { version = "=0.13.0", default-features = false, features = [
  "html",
] }

[dev-dependencies]
tempfile = "=3.27.0"
