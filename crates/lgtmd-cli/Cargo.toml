[package]
name = "lgtmd-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
description = "The shared lgtmd command line and native SDK bridge"
readme = "README.md"

[[bin]]
name = "lgtmd"
path = "src/main.rs"

[dependencies]
lgtmd = { path = "../lgtmd", version = "0.2.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.53.2", features = ["full"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
axum = "=0.8.9"
futures-util = "=0.3.34"
getrandom = "=0.4.3"
libc = "=0.2.190"

[dev-dependencies]
tempfile = "=3.27.0"
